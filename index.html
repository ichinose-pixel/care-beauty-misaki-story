<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#213c35"><meta name="description" content="元同僚から届く投稿とメッセージ。スマホを触って、あの笑顔の理由をたどる創作体験。"><title>あの投稿の、つづき。｜介護美容研究所</title><link rel="stylesheet" href="phone.css"><link rel="stylesheet" href="guidance.css"><script src="guidance.js" defer></script><link rel="stylesheet" href="clear-actions.css"><script src="clear-actions.js" defer></script><link rel="stylesheet" href="letter.css"><script src="phone.js" defer></script></head><body><aside class="desktop-copy"><p>あの投稿の、つづき。</p><h1>あの子、最近<br>ちょっと変わった？</h1><span>投稿の向こうの毎日を、<br>このスマホでたどる。</span></aside><main class="device" aria-label="物語のスマホ"><div class="status"><span>20:41</span><span>PR｜介護美容研究所</span><span aria-hidden="true">▮▮▮ ▰</span></div><header class="appbar"><button id="back" aria-label="前の画面へ">‹</button><div><b id="app-title">あの投稿の、つづき。</b><small id="app-subtitle">奈緒のスマホ</small></div><button id="home" aria-label="ホームへ">⌂</button></header><div id="screen" tabindex="-1"></div><nav id="dock" aria-label="アプリ"><button data-route="home">⌂<span>ホーム</span></button><button data-route="social">▦<span>投稿</span></button><button data-route="chat">▱<span>メッセージ</span><i id="badge" hidden></i></button></nav><div class="home-indicator" aria-hidden="true"></div></main><aside class="desktop-note">フィクションのスマホ体験<br>外部への送信・ログインはありません。</aside><template id="school-template"><section class="school" id="school" data-stage="school"><div class="chat"><p class="from-nao"><small>奈緒</small>でも、美容の仕事なんて<br>したことなかったよね？</p><p class="from-misaki"><small>美咲</small>うん。だから、学校で<br>基礎から学んだんだ。</p></div><p class="eyebrow">その一歩を、基礎から学ぶ場所。</p><img width="153" height="30" class="school-logo" src="assets/logo.svg" alt="介護美容研究所"><h2>「美容が好き」を、<br>人に届ける力へ。</h2><p>未経験から、高齢者に向けた美容と<br>コミュニケーションを学ぶ専門スクール。</p><figure class="official"><img width="937" height="636" src="assets/about-makeup.png" alt="メイクの道具を前に笑顔で目を合わせる二人" loading="lazy"><figcaption>ここからは、介護美容研究所の実際の学び。</figcaption></figure><div class="learning-comic"><div class="legacy-art class-art" role="img" aria-label="講師に教わりながらメイクを学ぶ場面の漫画"></div><p class="bubble left">技術だけじゃなくて、<br>声のかけ方も練習するんだね。</p></div><div class="lesson"><span>01　技術と、相手を知ること。</span><h3>メイク。ネイル。ケアエステ。<br>そして、声のかけ方も。</h3><img width="1004" height="340" src="assets/toha-photos.png" alt="ネイル、メイク、腕のケアを学ぶ様子" loading="lazy"><p>高齢者ケアの知識や認知症コミュニケーションも。<br>美容の技術と、相手への理解を一緒に学びます。</p></div><figure class="practice"><img width="1600" height="1067" src="assets/training-photo1.png" alt="利用者と目線を合わせて手元に触れる現場実習" loading="lazy"><figcaption><span>02　教室から、現場へ。</span><h3>習ったことを、<br>実習で経験に。</h3><p>現場での関わりを経験しながら、<br>活動のための準備を進めます。</p></figcaption></figure><div class="support"><span>03　暮らしと、これから。</span><h3>今の生活と、どう両立する？</h3><div class="weekly"><p>通学は</p><strong>週<span>1</span>日</strong><p>東京・横浜・大宮・名古屋<br>心斎橋・梅田・福岡</p></div><p>曜日や期間は、希望する校舎・コースで確認。<br>営業ツールや発信など、活動に向けた学びも。</p><p>卒業後に登録できる施設紹介サービス<br>「care sweet」などのサポートがあります。</p><small>採用・契約・仕事や収入を保証するものではありません。</small></div><div class="faq"><details><summary>資格がなくても、学べる？</summary><p>未経験の方も学べるケアビューティーのコースです。美容師・理容師免許を前提にした訪問美容とは異なります。受講条件は希望コースで確認できます。</p></details><details><summary>期間や費用を知りたい</summary><p>コースによって異なります。最新のコース内容・通い方・学費総額と支払い方法は、資料や学校への相談で確認してください。</p></details><details><summary>ブランクがあっても大丈夫？</summary><p>基礎から技術と高齢者への関わり方を学びます。これまでの経験や生活に合わせた学び方を、学校に相談できます。</p></details></div></section>
